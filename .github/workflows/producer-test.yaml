name: Producer API Test Suite

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'producer/**'
      - '.docker/producer/**'
      - 'pyproject.toml'
      - '.github/workflows/producer-test.yaml'

jobs:
  producer-tests:
    name: Run Producer API Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & Dev Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Pytest Suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
        run: |
          pytest producer/tests -v --durations=10
